[package]
name = "jpr-distance"
version = "0.1.0"
edition = "2021"

[lib]
# Python の拡張モジュールとして読み込む名前。`import jpr_distance` に対応する。
name = "jpr_distance"
crate-type = ["cdylib"]

[dependencies]
# Python 3.14 を使うので PyO3 は 0.29 以降が必要 (0.23 は 3.13 までしか通らない)。
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"
rayon = "1.10"

[profile.release]
# 音素列は 3〜24 要素しかなく DP の内側ループが短い。インライン展開と
# ベクトル化が効くようにコード生成単位をまとめる。
lto = true
codegen-units = 1
