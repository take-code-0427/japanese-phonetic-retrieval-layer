app = 'japanese-phonetic-retrieval'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # 索引の mmap を暖め直すコストを避けたいので 0 台には落とさない。
  # 落とすと次のリクエストが索引ロードを払う (実測: core 1.0s / full 9.6s)。
  # suspend はメモリ状態を保つので stop より復帰が速い。
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # shared-cpu-1x の上限が 2048 MiB なので、これ以上は CPU を増やさないと
  # 取れない (4gb を要求すると `cannot exceed 2048 MiB` でデプロイが落ちる)。
  # 全走査の一時配列を削って 2GB に収める方針。
  memory = '2gb'
  cpus = 1
  memory_mb = 2048
