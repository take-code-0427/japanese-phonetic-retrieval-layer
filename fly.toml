app = "japanese-phonetic-retrieval"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # 索引の mmap を暖め直すコストを避けたいので 0 台には落とさない。
  # 落とすと次のリクエストが 1 秒のロードを払う (実測: core で 1.0s)。
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # 実測のピーク RSS は core で 0.86GB。索引の mmap がページキャッシュを
  # 使うので、余裕を持たせるほど 2 回目以降が速い。
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
