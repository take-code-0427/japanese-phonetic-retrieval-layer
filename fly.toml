app = 'japanese-phonetic-retrieval'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # 索引の mmap を暖め直すコストを避けたいので 0 台には落とさない。
  # 落とすと次のリクエストが索引ロードを払う (実測: core 1.0s / full 9.6s)。
  # suspend はメモリ状態を保つので stop より復帰が速い。
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # 単発のピーク RSS は core で 0.86GB だが、モーラ範囲の全走査が母集団ぶんの
  # 一時配列を作るので 1 本で +279MB・10 本で +348MB 積む。2GB では並行
  # リクエストで OOM killed になった (実測: anon-rss 1.9GB で SIGKILL、
  # 502 が 60 並行中 15 件)。web.py 側でも全走査を 2 本に絞っているが、
  # 索引の mmap がページキャッシュを使うぶんも同じ cgroup に乗るため、
  # 余裕を持たせるほうが体感が安定する。
  memory = '4gb'
  cpus = 1
  memory_mb = 4096
